<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pago</title>
    <link rel="stylesheet" href="comprar.css">
</head>
<body>
    <div class="container">
        <form action="#">
            <div class="section billing">
                <h2>BILLING ADDRESS</h2>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Jacob Aiden">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@example.com">

                <label for="address">Address:</label>
                <input type="text" id="address" name="address" placeholder="Room - Street - Locality">

                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Berlin">

                <label for="state">State:</label>
                <input type="text" id="state" name="state" placeholder="Germany">

                <label for="zip">Zip Code:</label>
                <input type="text" id="zip" name="zip" placeholder="123 456">
            </div>

            <div class="section payment">
                <h2>PAYMENT</h2>

                <p>Cards Accepted:</p>
                <div class="cards">
                    <img src="paypal.png" alt="PayPal">
                    <img src="mastercard.png" alt="MasterCard">
                    <img src="visa.png" alt="Visa">
                    <img src="discover.png" alt="Discover">
                </div>

                <label for="cname">Name on Card:</label>
                <input type="text" id="cname" name="cname" placeholder="Mr. Jacob Aiden">

                <label for="ccnum">Credit Card Number:</label>
                <input type="text" id="ccnum" name="ccnum" placeholder="1111 2222 3333 4444">

                <label for="expmonth">Exp. Month:</label>
                <input type="text" id="expmonth" name="expmonth" placeholder="August">

                <label for="expyear">Exp. Year:</label>
                <input type="text" id="expyear" name="expyear" placeholder="2025">

                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" placeholder="123">
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
